<section class="metas-page">
	<header class="metas-page__header">
		<div>
			<h2 class="fw-700">Metas Financieras</h2>
			<p class="text-secondary">Planifica, ahorra y alcanza tus sueños.</p>
		</div>
		
	</header>

	<div class="metas-page__stats">
		<div class="card metas-page__stat">
			<small class="text-muted">TOTAL AHORRADO</small>
			<div class="metas-page__stat-value fw-700">S/0.00</div>
		</div>
		<div class="card metas-page__stat">
			<small class="text-muted">PROGRESO</small>
			<div class="metas-page__stat-value fw-700">0.0%</div>
		</div>
		<div class="card metas-page__stat">
			<small class="text-muted">COMPLETADAS</small>
			<div class="metas-page__stat-value fw-700">0/0</div>
		</div>
		<div class="card metas-page__stat">
			<small class="text-muted">RACHA MÁXIMA</small>
			<div class="metas-page__stat-value fw-700">0 días</div>
		</div>
	</div>

	<section class="metas-page__contenido">
		<h3 class="fw-700">Metas Financieras</h3>
		<p class="text-muted">Planifica, ahorra y alcanza tus sueños.</p>

		<div class="metas-page__grid">
			<div class="card metas-page__crear">
				<div class="metas-page__crear-inner">
					<div class="metas-page__crear-icono">
						<i class="fas fa-plus"></i>
					</div>
					<strong>Crea Nueva Meta</strong>
					<small class="text-muted">Define un nuevo objetivo</small>
				</div>
			</div>

			<div class="card metas-page__meta">
				<div class="metas-page__meta-header">
					<div class="metas-page__meta-titulo">Viaje a cuzco <span class="text-muted">Ahorro</span></div>
					<button class="metas-page__meta-action"><i class="fas fa-plus"></i></button>
				</div>

				<div class="metas-page__meta-body">
					<div class="metas-page__meta-progreso">Progreso <span class="fw-700">S/0.00</span></div>
					<div class="metas-page__meta-meta">Meta <span class="text-muted">S/100.00</span></div>

					<div class="metas-page__barra">
						<div class="metas-page__barra-fill" style="width: 0%"></div>
					</div>

					<div class="metas-page__meta-footer">
						<span class="text-muted">0.0%</span>
						<span class="text-muted">18 días</span>
					</div>
				</div>
			</div>
		</div>
	</section>
</section>
